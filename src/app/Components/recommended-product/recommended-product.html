<div class="card my-20">
  <h2 class="text-center text-3xl font-bold pb-16 uppercase">{{ this.sectionName() }}</h2>

    @if (productList().length !== 0) {
        <p-carousel
        [value]="productList()"
        [numVisible]="4"
        [numScroll]="1"
        [responsiveOptions]="responsiveOptions"
        >
        <ng-template let-product pTemplate="item">
            <div class="m-2 cursor-pointer p-3" class="card-item flex flex-col justify-center">
            <div class="mb-3 cursor-pointer">
                <div class="relative mx-auto">
                <img [src]="product.image" [alt]="product.name" class="w-full border-round mx-auto" />
                </div>
            </div>
            <div class="mb-1 pt-5 font-medium text-xl text-center">
                {{ product.name }}
            </div>
            <span class="madeby text-center text-gray-500 text-md font-thin">
                by <a href="" class="underline">{{ product.madeBy }}</a></span
            >
            <p class="bran-name font-thin text-center py-2">{{ product.brand }}</p>
            <div class="price flex items-center py-3 justify-center gap-2">
                <p class="font-thin">from</p>
                <div class="pricenum font-bold text-2xl">${{ product.price }}</div>
            </div>
            <button class="text-center cursor-pointer border border-gray-400 font-bold">
                ADD TO BAG
            </button>
            </div>
        </ng-template>
        </p-carousel>
        <button
        class="mx-auto my-11 block border-2 border-zinc-400 font-bold text-center px-10 py-3 cursor-pointer"
        >
        SHOP MORE
        </button>
    } 
    @else {
        <h2 class="text-center font-bold text-2xl">No Product Yet</h2>
    }
</div>
